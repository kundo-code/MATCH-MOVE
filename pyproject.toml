[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matchmove"
version = "1.0.0"
description = "Golf course drone match move / course intelligence - verified AR course guides locked to real drone footage"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
matchmove = "matchmove.cli:main"

[tool.setuptools]
packages = ["matchmove", "matchmove.exporters"]

[tool.setuptools.package-data]
matchmove = ["data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
